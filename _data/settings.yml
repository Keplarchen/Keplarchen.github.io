  author_bio: Hi! I'm Su Chen, an M.S. student in Computer Engineering at New York University's Tandon School of Engineering. My research interests lie in Computer Vision, Efficient AI, and Multimodal Large Language Models (MLLMs), especially in deploying deep models on edge devices such as AR/VR platforms. At NYU, I was very fortunate to work with <a href="https://www.saiqianzhang.com/" target="_blank">Prof. Saiqian Zhang</a>.<br><br>Before NYU, I received my B.Eng. from Xi'an Jiaotong University.
